name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # CPA host image the plugin must load in. Bump together with the
  # github.com/router-for-me/CLIProxyAPI/v8 requirement in go.mod.
  CPA_IMAGE: eceasy/cli-proxy-api:v8.0.54
  # Upstream CPA release builds require GLIBC <= 2.17; match it.
  MAX_GLIBC: "2.17"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test ./...

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            target: x86_64-linux-gnu.2.17
          - goarch: arm64
            target: aarch64-linux-gnu.2.17
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Version
        run: echo "VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo dev)" >> "$GITHUB_ENV"
      - name: Build
        run: make build GOOS=linux GOARCH=${{ matrix.goarch }} VERSION=$VERSION CC="zig cc -target ${{ matrix.target }}"
      - name: Check glibc requirement
        run: |
          need=$(objdump -T dist/linux/${{ matrix.goarch }}/muse.so | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "requires GLIBC $need (max $MAX_GLIBC)"
          [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" = "$MAX_GLIBC" ]
      - uses: actions/upload-artifact@v5
        with:
          name: muse-linux-${{ matrix.goarch }}
          path: dist/linux/${{ matrix.goarch }}/muse.so
          if-no-files-found: error

  build-darwin:
    runs-on: macos-15
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Version
        run: echo "VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo dev)" >> "$GITHUB_ENV"
      - name: Build
        run: make build GOOS=darwin GOARCH=${{ matrix.goarch }} VERSION=$VERSION
      - uses: actions/upload-artifact@v5
        with:
          name: muse-darwin-${{ matrix.goarch }}
          path: dist/darwin/${{ matrix.goarch }}/muse.dylib
          if-no-files-found: error

  # Load the built library in the stock CPA image on each Linux architecture.
  smoke:
    needs: build-linux
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: muse-linux-${{ matrix.goarch }}
          path: smoke/plugins/linux/${{ matrix.goarch }}
      - name: Load plugin in ${{ env.CPA_IMAGE }}
        run: |
          mkdir -p smoke/auths
          cat > smoke/config.yaml <<'EOF'
          config-version: 8
          access:
            api-keys: ["smoke"]
          oauth:
            auth-dir: "/data/auths"
          plugins:
            enabled: true
            dir: "/data/plugins"
            configs:
              muse:
                enabled: true
          EOF
          docker run -d --name cpa -v "$PWD/smoke:/data" "$CPA_IMAGE" ./CLIProxyAPI --config /data/config.yaml
          for _ in $(seq 30); do
            if docker logs cpa 2>&1 | grep -q 'plugin registered plugin_id=muse'; then
              docker logs cpa 2>&1 | grep pluginhost
              exit 0
            fi
            sleep 1
          done
          docker logs cpa
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-darwin, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for dir in artifacts/muse-*; do
            platform="${dir#artifacts/muse-}"   # e.g. linux-amd64
            lib=$(ls "$dir")
            chmod 0755 "$dir/$lib"
            (cd "$dir" && zip -X "$GITHUB_WORKSPACE/release/muse_${version}_${platform/-/_}.zip" "$lib")
          done
          (cd release && sha256sum *.zip > checksums.txt && cat checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
